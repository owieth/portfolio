# Supply-chain hardening. No `packages:` key on purpose — this is a single-package
# repo and the file exists only because pnpm reads these settings from nowhere else.

# Quarantine every release for its first seven days, so a compromised publish has
# to survive a week of public scrutiny before it can enter the lockfile.
# Dependabot's `cooldown` in `.github/dependabot.yml` keeps its proposals at least
# as old as the quarantine.
# Security updates skip the cooldown, so a security fix younger than seven days
# needs a temporary `minimumReleaseAgeExclude` entry, removed once the release
# ages out.
minimumReleaseAge: 10080

# Refuse transitive dependencies resolved from git, file or tarball URLs; those
# bypass the registry and its provenance entirely.
blockExoticSubdeps: true

# Reject a package whose signature trust level drops between resolutions.
# The `eslint-import-resolver-typescript@3` override in `package.json` keeps this
# whole: 3.10.1, the last 3.x, came from the v3.x branch, whose release workflow
# never gained provenance, after 4.2.6 shipped with it, so it fails
# `no-downgrade`. 3.10.0 predates 4.2.6 and differs from 3.10.1 only in brace
# style and dependency floors. eslint-config-next asks for `^3.5.2`; drop the
# override once it moves to 4.x.
trustPolicy: no-downgrade

# Exact versions already in the lockfile that fail `no-downgrade` only because an
# older major line was patched after the newer line gained provenance. Each entry
# must match the locked integrity; drop it once nothing depends on that version.
# - semver@6.3.1: the 2023 ReDoS backport (published by the npm CLI team after
#   7.5.2 shipped with provenance). Required by @babel/core and
#   @babel/helper-compilation-targets (via eslint-plugin-react-hooks, and as
#   styled-jsx's peer under next), eslint-plugin-import, eslint-plugin-react and
#   node-exports-info (via resolve).
trustPolicyExclude:
  - 'semver@6.3.1'
