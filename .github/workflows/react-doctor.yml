# React Doctor: security, performance, correctness, accessibility, bundle-size,
# and architecture checks for React.
#
# Runs the react-doctor devDependency from pnpm-lock.yaml, so CI gets the same
# integrity-checked, quarantined versions as `pnpm react-doctor` locally.
# Docs: https://www.react.doctor/ci

name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The whole project on every run, not only what the pull request changed.
      # The backlog is clear, so a new error fails the check.
      - run: pnpm react-doctor --scope full --blocking error
